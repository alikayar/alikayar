      }
      .content-enter { animation: content-enter 300ms ease-out both; }
      @keyframes rule-draw {
        from { stroke-dashoffset: 500; }
        to { stroke-dashoffset: 0; }
      }
      .rule-draw { animation: rule-draw 700ms ease-out both; }
      @keyframes cursor-blink {
        50% { opacity: 0; }
      }
      .cursor { animation: cursor-blink 1s steps(1) infinite; }
    </style>
